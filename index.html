<!DOCTYPE html>
<html>
    <style>
    body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 40px auto;
    }
    h1 {
    text-align: center;
    margin-bottom: 10px;
    }
    #totalExpense {
    font-size: 20px;
    font-weight: bold;
    }
    #expenseList li {
    margin: 8px 0;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    }
    #expenseList li {
    margin: 8px 0;
    }
    input, button {
        padding: 8px;
        margin: 4px;
    }
    #expenseList button {
    margin-left: 10px;
    padding: 5px 10px;
    }
</style>
<head>
    <title>My Expense Tracker</title>
</head>
<body>
    <h1>Expense Tracker</h1>
    <p>Quản lý các khoản chi tiêu của bạn</p>
    <ul id="expenseList">
        <li>Ăn sáng - 30000đ</li>
    </ul>
    <p id="totalExpense">Tổng chi tiêu: 30000đ</p>
    <input id="expenseName" type="text" placeholder="Tên khoản chi">
    <input id="expenseAmount" type="number" placeholder="Số tiền">
    <button id="addExpense">Thêm khoản chi</button>
    <script src="script.js"></script>
</body>
</html>
